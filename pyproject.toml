[project]
name = "wwos"
version = "0.1.0"
description = "White Waters Consulting Group - Autonomous AI Business Operating System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "anthropic>=2.12,<3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
wwos = "wwos.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wwos*"]

[tool.setuptools.package-data]
wwos = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "acceptance: end-to-end acceptance tests owned by the QA function",
  "postgres: requires WWOS_TEST_PG_URL",
  "browser: requires Playwright and a Chromium binary",
]
