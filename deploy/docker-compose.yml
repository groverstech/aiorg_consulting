# Production-shaped stack: API, background worker, PostgreSQL.
# Secrets come from deploy/.env (never committed). See docs/RUNBOOK.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wwos
      POSTGRES_USER: wwos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwos"]
      interval: 10s
      retries: 5
    restart: unless-stopped
  api:
    build: ..
    env_file: .env
    environment:
      WWOS_DATABASE_URL: postgresql+psycopg://wwos:${POSTGRES_PASSWORD}@db:5432/wwos
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  worker:
    build: ..
    command: ["wwos", "worker"]
    env_file: .env
    environment:
      WWOS_DATABASE_URL: postgresql+psycopg://wwos:${POSTGRES_PASSWORD}@db:5432/wwos
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  pgdata:
